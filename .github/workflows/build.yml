name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release -- /clp:ErrorsOnly

      - name: Locate VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Path build -Filter "*.vst3" -Directory | Select-Object -First 1
          if (-not $vst3) { throw "No .vst3 found" }
          echo "VST3_PATH=$($vst3.FullName)" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PD-VST3
          path: ${{ env.VST3_PATH }}
